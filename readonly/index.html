<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>HSTC_AMZ_CW · 只读报表</title><link rel="stylesheet" href="viewer.css"></head>
<body><main>
<header><div><p class="eyebrow">HSTC_AMZ_CW / 只读报表</p><h1>账目清楚，经营有数</h1><p class="muted">只展示已发布的数据，可查看与筛选。导入、修改和删除请在管理端操作。</p></div><span class="badge">只读模式</span></header>
<section id="gate" class="card gate"><h2>查看共享账本</h2><p class="muted">输入 M 码，在当前浏览器中解密。M 码不会发送到 GitHub。</p><form id="unlock"><label for="password">共用 M 码</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button id="open" type="submit">解锁报表</button></form><p id="message" role="status" aria-live="polite"></p></section>
<div id="report" hidden>
<section class="card toolbar"><div><strong id="updated"></strong><p id="freshness" class="muted"></p></div><div><button id="refresh" type="button">检查快照更新</button><button id="lock" type="button">锁定</button></div></section><p id="notice" role="status"></p>
<section class="card"><h2>交易流水</h2><div class="filters"><label>店铺<select id="account"></select></label><label>站点<select id="site"></select></label><label>币种<select id="currency"></select></label><label>开始日期<input id="from" type="date"></label><label>结束日期<input id="to" type="date"></label><label>搜索<input id="query" type="search" placeholder="订单、SKU、说明"></label></div><p class="muted">各币种分别统计，不直接相加；提现单列，不计入经营净额。</p><div id="totals" class="totals"></div><p id="count" class="muted"></p><div class="scroll"><table><thead><tr><th>日期</th><th>店铺 / 站点</th><th>类型</th><th>说明 / 订单 / SKU</th><th>金额</th></tr></thead><tbody id="transactions"></tbody></table></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>
<section class="card"><h2>商品汇总 · ASIN 分析</h2><p class="muted">商品数据独立展示，不重复计入交易流水。每次选择一份完整期间报表。</p><label>商品报表<select id="products"></select></label><p id="productSummary"></p><div class="filters"><label>搜索 ASIN / MSKU<input id="productQuery" type="search"></label><label>占比口径<select id="ratio"><option value="sales">金额 ÷ 本商品净销售额；数量 ÷ 报表同项合计</option><option value="share">全部 ÷ 报表同项合计</option></select></label></div><details><summary>选择商品分析字段</summary><div id="fields" class="fields"></div></details><div class="scroll"><table><thead id="productHead"></thead><tbody id="productBody"></tbody></table></div><div class="pager"><button id="productPrev">上一页</button><span id="productPage"></span><button id="productNext">下一页</button></div></section>
</div><footer>GitHub 只读通道 · 数据在浏览器内解密 · 不向管理端发起写入请求</footer>
</main><script type="module" src="viewer.mjs"></script></body></html>
